<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>California Housing — Порівняння Моделей Регресії (stlite)</title>
  <!-- Stlite CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css"
  />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0e1117;
    }
    /* Top Navigation Header */
    .top-nav {
      background: rgba(14, 17, 23, 0.95);
      border-bottom: 1px solid #30363d;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 999;
      backdrop-filter: blur(8px);
    }
    .top-nav a {
      color: #ffaa00;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid rgba(255, 170, 0, 0.3);
      border-radius: 6px;
      transition: all 0.2s ease;
      background: rgba(255, 170, 0, 0.05);
    }
    .top-nav a:hover {
      background: rgba(255, 170, 0, 0.15);
      border-color: #ffaa00;
      transform: translateY(-1px);
    }
    .nav-title {
      font-size: 0.95rem;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-title strong {
      color: #f0f6fc;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(255, 75, 75, 0.15);
      color: #ff4b4b;
      border: 1px solid rgba(255, 75, 75, 0.3);
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      color: #ffffff;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: #ff4b4b;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-msg {
      color: #ff4b4b;
      background: rgba(255, 75, 75, 0.1);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #ff4b4b;
      max-width: 500px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="top-nav">
    <a href="../index.html#projects">
      ← <span>Повернутися на головну</span>
    </a>
    <div class="nav-title">
      <span class="badge">PROJECT 1</span>
      <strong>California Housing</strong> // Регресія & Overfitting
    </div>
    <div style="display: flex; gap: 10px;">
      <a href="p2.html">
        <span>Проєкт 2 (Decision Tree) →</span>
      </a>
      <a href="p3.html">
        <span>Проєкт 3 (OpenCV Canny) →</span>
      </a>
    </div>
  </header>

  <div id="root">
    <div id="loading">
      <div class="spinner"></div>
      <h2>Завантаження Streamlit (stlite / Pyodide)...</h2>
      <p>Завантаження WebAssembly, датасету та вихідного файлу p1.py...</p>
    </div>
  </div>

  <!-- Stlite JS -->
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
  <script>
    Promise.all([
      fetch("./p1.py").then((res) => {
        if (!res.ok) throw new Error("Не вдалося завантажити p1.py (HTTP " + res.status + ")");
        return res.text();
      }),
      fetch("./california_housing.csv").then((res) => {
        if (!res.ok) return null;
        return res.text();
      })
    ])
    .then(([pyCode, csvContent]) => {
      const files = { "p1.py": pyCode };
      if (csvContent) {
        files["california_housing.csv"] = csvContent;
      }

      stlite.mount(
        {
          requirements: ["scikit-learn", "pandas", "numpy", "matplotlib"],
          entrypoint: "p1.py",
          files: files
        },
        document.getElementById("root")
      );
    })
    .catch((err) => {
      console.error("Помилка завантаження файлів:", err);
      document.getElementById("root").innerHTML = `
        <div id="loading">
          <div class="error-msg">
            <h3>❌ Помилка завантаження p1.py</h3>
            <p>${err.message}</p>
            <small>Переконайтеся, що файли p1.py та california_housing.csv знаходяться в папці python/.</small>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
