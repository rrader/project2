<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>California Housing - Streamlit (stlite)</title>
  <!-- Stlite CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css"
  />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0e1117;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #ffffff;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: #ff4b4b;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-msg {
      color: #ff4b4b;
      background: rgba(255, 75, 75, 0.1);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #ff4b4b;
      max-width: 500px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <div class="spinner"></div>
      <h2>Завантаження Streamlit (stlite / Pyodide)...</h2>
      <p>Завантаження WebAssembly, датасету та вихідного файлу p1.py...</p>
    </div>
  </div>

  <!-- Stlite JS -->
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
  <script>
    Promise.all([
      fetch("./p1.py").then((res) => {
        if (!res.ok) throw new Error("Не вдалося завантажити p1.py (HTTP " + res.status + ")");
        return res.text();
      }),
      fetch("./california_housing.csv").then((res) => {
        if (!res.ok) return null;
        return res.text();
      })
    ])
    .then(([pyCode, csvContent]) => {
      const files = { "p1.py": pyCode };
      if (csvContent) {
        files["california_housing.csv"] = csvContent;
      }

      stlite.mount(
        {
          requirements: ["scikit-learn", "pandas", "numpy", "matplotlib"],
          entrypoint: "p1.py",
          files: files
        },
        document.getElementById("root")
      );
    })
    .catch((err) => {
      console.error("Помилка завантаження файлів:", err);
      document.getElementById("root").innerHTML = `
        <div id="loading">
          <div class="error-msg">
            <h3>❌ Помилка завантаження p1.py</h3>
            <p>${err.message}</p>
            <small>Переконайтеся, що файли p1.py та california_housing.csv знаходяться в папці python/.</small>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
